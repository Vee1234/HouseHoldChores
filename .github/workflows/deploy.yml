name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # Applies any new files in migrations/ before the new code goes live.
      - name: Migrate database
        run: npx wrangler d1 migrations apply cosy-chores --remote

      # Type-checks, builds, then runs `wrangler deploy`. VAPID secrets already
      # live on the Worker, so deploys leave them untouched.
      - name: Deploy
        run: npm run deploy
